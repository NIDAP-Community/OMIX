interface_version: 1
entrypoint: scripts/run_gsea.R
control_classifications:
  public: Standard user-facing control that deployment adapters should expose.
  advanced: Supported user-facing control that deployment adapters should expose in an advanced section.
  internal: Portable CLI plumbing that deployment adapters manage rather than expose.
inputs:
  deg_table:
    required: true
    type: path
    classification: public
    formats: [csv, tsv, txt, rds]
    description: Differential-expression table with one gene identifier column and one or more ranking-score columns. Recognized Seurat FindMarkers wide and native profiles are normalized by the shared OmixPathwayInputs package.
  pathways_database:
    required: true
    type: path
    classification: public
    formats: [csv, tsv, txt, rds]
    description: Gene-set membership database.
parameters:
  output_dir:
    type: path
    default: results
    classification: internal
    description: Portable result directory. Deployment adapters provide their platform-managed output location.
  gene_names_column:
    type: string
    default: null
    classification: advanced
    description: Optional gene-symbol column. When omitted, auto-detects GeneName, then Gene Symbols and other common identifiers.
  species:
    type: string
    default: Human
    classification: public
    allowed: [Dog, Drosophila, Chimpanzee, Human, Macaque, Mouse, Rabbit, Rat, Zebrafish]
  gene_scores_suffix:
    type: string
    default: _tstat
    classification: public
    description: Exact suffix used to identify ranking-score columns and derive contrast names. When this control is not explicitly supplied, a recognized FindMarkers table uses signed log fold change through the normalized `_logFC` alias; other inputs retain `_tstat`.
  contrasts:
    type: string
    default: null
    classification: public
    delimiter: ","
    preserves_order: true
    description: Optional comma-separated contrast names. When supplied, only these contrasts are analyzed and plotted in the given order. A recognized wide FindMarkers table uses all complete families in source-column order when omitted; a native unprefixed FindMarkers table requires exactly one supplied label. Other inputs use every column ending in gene_scores_suffix.
  pathways_species:
    type: string
    default: Human
    classification: public
    allowed: [Dog, Drosophila, Chimpanzee, Human, Macaque, Mouse, Rabbit, Rat, Zebrafish]
    description: Species label used to select gene sets from the pathways database.
  collections:
    type: string
    default: "H: hallmark gene sets,C2:CP:REACTOME: Reactome gene sets"
    classification: public
    delimiter: ","
    description: Comma-separated collection names that must exactly match the selected pathways-database species.
  min_geneset_size:
    type: integer
    default: 15
    classification: advanced
    minimum: 1
  max_geneset_size:
    type: integer
    default: 500
    classification: advanced
    minimum: 1
  n_permutations:
    type: integer
    default: 5000
    classification: advanced
    minimum: 1
  random_seed:
    type: integer
    default: 246642
    classification: advanced
  fdr_mode:
    type: string
    default: within each collection
    classification: public
    allowed: [over all collections, within each collection]
  collapse_redundancy:
    type: boolean
    default: false
    classification: advanced
  sort_by:
    type: string
    default: pval
    classification: advanced
    allowed: [contrast, collection, pathway, pval, padj, ES, NES, size, nMoreExtreme]
  image_width:
    type: integer
    default: 2500
    classification: advanced
    minimum: 1
  image_height:
    type: integer
    default: 2500
    classification: advanced
    minimum: 1
  image_resolution:
    type: integer
    default: 300
    classification: advanced
    minimum: 1
outputs:
  gsea_results:
    path: gsea_results.csv
    format: csv
  gsea_pvalue_tables:
    path: gsea_pvalue_tables.png
    format: png
