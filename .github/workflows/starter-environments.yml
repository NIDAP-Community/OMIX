name: Starter Environments

on:
  pull_request:
    paths:
      - starter-environments/**
      - packages/OmixPathwayPlots/**
      - .dockerignore
      - .github/workflows/starter-environments.yml
  push:
    branches:
      - main
    paths:
      - starter-environments/**
      - packages/OmixPathwayPlots/**
      - .dockerignore
      - .github/workflows/starter-environments.yml
  workflow_dispatch:
    inputs:
      target:
        description: Starter environment to build (select one to publish only that image)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - all
          - r-base
          - r-pathway
          - r-seurat-conversion
          - r-singlecell
          - r-visualization
          - r-statistics
      publish:
        description: Publish the validated images to GHCR
        required: true
        default: false
        type: boolean
      adopt_existing:
        description: Retag existing GHCR manifests without rebuilding them
        required: true
        default: false
        type: boolean
      existing_source_tag:
        description: Existing tag to adopt when retagging (normally latest)
        required: true
        default: latest
        type: string

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.changes.outputs.base }}
      pathway: ${{ steps.changes.outputs.pathway }}
      pathway_package: ${{ steps.changes.outputs.pathway_package }}
      conversion: ${{ steps.changes.outputs.conversion }}
      singlecell: ${{ steps.changes.outputs.singlecell }}
      visualization: ${{ steps.changes.outputs.visualization }}
      statistics: ${{ steps.changes.outputs.statistics }}
      workflow: ${{ steps.changes.outputs.workflow }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect starter-environment changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          # Require every rule in a filter to match. Without this, a negative
          # README rule matches changes anywhere else in the repository and
          # falsely selects every starter environment.
          predicate-quantifier: every
          filters: |
            base:
              - 'starter-environments/r-base/**'
              - '!starter-environments/r-base/README.md'
            pathway:
              - 'starter-environments/r-pathway/**'
              - '!starter-environments/r-pathway/README.md'
            singlecell:
              - 'starter-environments/r-singlecell/**'
              - '!starter-environments/r-singlecell/README.md'
            pathway_package:
              - 'packages/OmixPathwayPlots/**'
              - '!packages/OmixPathwayPlots/README.md'
              - '!packages/OmixPathwayPlots/CHANGELOG.md'
            conversion:
              - 'starter-environments/r-seurat-conversion/**'
              - '!starter-environments/r-seurat-conversion/README.md'
            visualization:
              - 'starter-environments/r-visualization/**'
              - '!starter-environments/r-visualization/README.md'
            statistics:
              - 'starter-environments/r-statistics/**'
              - '!starter-environments/r-statistics/README.md'
            workflow:
              - '.github/workflows/starter-environments.yml'

  build:
    needs: filter
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.adopt_existing }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A base-image change validates every dependent image. A change to a
      # satellite environment validates only that environment against the
      # existing immutable r-base release. This keeps routine package work
      # from being blocked by unrelated long-running images.
      - name: Select starter-environment targets
        id: targets
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'auto' }}
          REQUESTED_PUBLISH: ${{ inputs.publish || 'false' }}
          BASE_CHANGED: ${{ needs.filter.outputs.base }}
          PATHWAY_CHANGED: ${{ needs.filter.outputs.pathway }}
          PATHWAY_PACKAGE_CHANGED: ${{ needs.filter.outputs.pathway_package }}
          CONVERSION_CHANGED: ${{ needs.filter.outputs.conversion }}
          SINGLECELL_CHANGED: ${{ needs.filter.outputs.singlecell }}
          VISUALIZATION_CHANGED: ${{ needs.filter.outputs.visualization }}
          STATISTICS_CHANGED: ${{ needs.filter.outputs.statistics }}
        run: |
          set -euo pipefail

          base=false
          pathway=false
          conversion=false
          singlecell=false
          visualization=false
          statistics=false

          case "$REQUESTED_TARGET" in
            auto)
              base="$BASE_CHANGED"
              pathway="$PATHWAY_CHANGED"
              if [[ "$PATHWAY_PACKAGE_CHANGED" == "true" ]]; then
                pathway=true
              fi
              conversion="$CONVERSION_CHANGED"
              singlecell="$SINGLECELL_CHANGED"
              visualization="$VISUALIZATION_CHANGED"
              statistics="$STATISTICS_CHANGED"
              if [[ "$base" == "true" ]]; then
                pathway=true
                conversion=true
                singlecell=true
                visualization=true
                statistics=true
              fi
              ;;
            all)
              base=true
              pathway=true
              conversion=true
              singlecell=true
              visualization=true
              statistics=true
              ;;
            r-base)
              base=true
              ;;
            r-pathway)
              pathway=true
              ;;
            r-seurat-conversion)
              conversion=true
              ;;
            r-singlecell)
              singlecell=true
              ;;
            r-visualization)
              visualization=true
              ;;
            r-statistics)
              statistics=true
              ;;
            *)
              echo "Unknown target: $REQUESTED_TARGET" >&2
              exit 1
              ;;
          esac

          if [[ "$REQUESTED_PUBLISH" == "true" && "$REQUESTED_TARGET" == "auto" ]]; then
            echo "Publishing requires an explicit target (or all); auto has no deterministic release scope." >&2
            exit 1
          fi

          {
            echo "base=$base"
            echo "pathway=$pathway"
            echo "conversion=$conversion"
            echo "singlecell=$singlecell"
            echo "visualization=$visualization"
            echo "statistics=$statistics"
          } >> "$GITHUB_OUTPUT"

          printf 'Selected targets: base=%s pathway=%s conversion=%s singlecell=%s visualization=%s statistics=%s\n' \
            "$base" "$pathway" "$conversion" "$singlecell" "$visualization" "$statistics"

      - name: Build r-base
        if: steps.targets.outputs.base == 'true'
        uses: docker/build-push-action@v6
        with:
          context: starter-environments/r-base
          load: true
          tags: omix-r-base:ci

      # `docker/build-push-action` runs with an isolated BuildKit context, so
      # it cannot resolve the locally loaded `omix-r-base:ci` tag. The runner
      # Docker daemon can resolve that tag directly after the preceding build.
      - name: Build r-pathway
        if: steps.targets.outputs.pathway == 'true'
        run: |
          if [[ "${{ steps.targets.outputs.base }}" == "true" ]]; then
            docker build \
              --build-arg BASE_IMAGE=omix-r-base:ci \
              --tag omix-r-pathway:ci \
              --file starter-environments/r-pathway/Dockerfile \
              .
          else
            docker build \
              --tag omix-r-pathway:ci \
              --file starter-environments/r-pathway/Dockerfile \
              .
          fi

      - name: Build r-singlecell
        if: steps.targets.outputs.singlecell == 'true'
        run: |
          if [[ "${{ steps.targets.outputs.base }}" == "true" ]]; then
            docker build \
              --build-arg BASE_IMAGE=omix-r-base:ci \
              --tag omix-r-singlecell:ci \
              --file starter-environments/r-singlecell/Dockerfile \
              .
          else
            docker build \
              --tag omix-r-singlecell:ci \
              --file starter-environments/r-singlecell/Dockerfile \
              .
          fi

      - name: Build r-seurat-conversion
        if: steps.targets.outputs.conversion == 'true'
        run: |
          if [[ "${{ steps.targets.outputs.base }}" == "true" ]]; then
            docker build \
              --build-arg BASE_IMAGE=omix-r-base:ci \
              --tag omix-r-seurat-conversion:ci \
              --file starter-environments/r-seurat-conversion/Dockerfile \
              .
          else
            docker build \
              --tag omix-r-seurat-conversion:ci \
              --file starter-environments/r-seurat-conversion/Dockerfile \
              .
          fi

      - name: Build r-visualization
        if: steps.targets.outputs.visualization == 'true'
        run: |
          if [[ "${{ steps.targets.outputs.base }}" == "true" ]]; then
            docker build \
              --build-arg BASE_IMAGE=omix-r-base:ci \
              --tag omix-r-visualization:ci \
              starter-environments/r-visualization
          else
            docker build \
              --tag omix-r-visualization:ci \
              starter-environments/r-visualization
          fi

      - name: Build r-statistics
        if: steps.targets.outputs.statistics == 'true'
        run: |
          if [[ "${{ steps.targets.outputs.base }}" == "true" ]]; then
            docker build \
              --build-arg BASE_IMAGE=omix-r-base:ci \
              --tag omix-r-statistics:ci \
              starter-environments/r-statistics
          else
            docker build \
              --tag omix-r-statistics:ci \
              starter-environments/r-statistics
          fi

      - name: Verify statistical runtime
        if: steps.targets.outputs.statistics == 'true'
        run: |
          docker run --rm --entrypoint Rscript omix-r-statistics:ci -e '
            packages <- c("limma", "edgeR", "optparse")
            versions <- vapply(packages, function(package) {
              suppressPackageStartupMessages(library(package, character.only = TRUE))
              as.character(packageVersion(package))
            }, character(1))
            writeLines(paste(sprintf("%s %s", packages, versions), collapse = "\\n"))
          '

      - name: Verify visualization runtime
        if: steps.targets.outputs.visualization == 'true'
        run: |
          docker run --rm --entrypoint Rscript omix-r-visualization:ci -e '
            packages <- c(
              "ggplot2", "dplyr", "tidyr", "ggbeeswarm", "broom",
              "multcomp", "multcompView", "RColorBrewer", "plotly",
              "patchwork", "pheatmap", "optparse"
            )
            versions <- vapply(packages, function(package) {
              suppressPackageStartupMessages(library(package, character.only = TRUE))
              as.character(packageVersion(package))
            }, character(1))
            writeLines(paste(sprintf("%s %s", packages, versions), collapse = "\\n"))
          '

      - name: Verify single-cell runtime
        if: steps.targets.outputs.singlecell == 'true'
        run: |
          docker run --rm --entrypoint Rscript omix-r-singlecell:ci -e '
            packages <- c("Omix", "OmixSeurat", "SeuratObject", "Matrix", "optparse")
            versions <- vapply(packages, function(package) {
              suppressPackageStartupMessages(library(package, character.only = TRUE))
              as.character(packageVersion(package))
            }, character(1))
            writeLines(paste(sprintf("%s %s", packages, versions), collapse = "\\n"))
          '

      - name: Verify Seurat conversion runtime
        if: steps.targets.outputs.conversion == 'true'
        run: |
          docker run --rm --entrypoint Rscript omix-r-seurat-conversion:ci -e '
            packages <- c(
              "Omix", "OmixSeurat", "Seurat", "SeuratObject", "sctransform",
              "Matrix", "optparse"
            )
            versions <- vapply(packages, function(package) {
              suppressPackageStartupMessages(library(package, character.only = TRUE))
              as.character(packageVersion(package))
            }, character(1))
            stopifnot(methods::getClass("SCTAssay")@package == "Seurat")
            writeLines(paste(sprintf("%s %s", packages, versions), collapse = "\\n"))
          '

      - name: Smoke-test serialized Seurat conversion
        if: steps.targets.outputs.conversion == 'true'
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/starter-environments/r-seurat-conversion/tests:/tests:ro" \
            --entrypoint Rscript \
            omix-r-seurat-conversion:ci \
            /tests/test-seurat-conversion.R

      - name: Capture statistics package inventory
        if: steps.targets.outputs.statistics == 'true'
        run: |
          mkdir -p build-artifacts/statistics
          docker run --rm \
            --volume "${{ github.workspace }}/build-artifacts/statistics:/out" \
            --entrypoint Rscript \
            omix-r-statistics:ci \
            -e '
              installed <- as.data.frame(installed.packages(lib.loc = .libPaths()))
              write.csv(
                installed[, c("Package", "Version", "Built", "LibPath")],
                "/out/installed-packages.csv",
                row.names = FALSE
              )
              writeLines(capture.output(sessionInfo()), "/out/sessionInfo.txt")
              writeLines(as.character(BiocManager::version()), "/out/bioconductor-version.txt")
              project <- tempfile("renv-project-")
              dir.create(project)
              renv::snapshot(
                project = project,
                library = .libPaths(),
                lockfile = "/out/renv.lock",
                type = "all",
                # `littler` is supplied as an executable by the r-base image.
                # Restoring it into the isolated R library would recompile the
                # binary wrapper and require r-base build-time linker files.
                exclude = "littler",
                prompt = FALSE,
                force = TRUE
              )
            '

      - name: Upload statistics package inventory
        if: steps.targets.outputs.statistics == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: statistics-package-inventory
          path: build-artifacts/statistics
          if-no-files-found: error
          retention-days: 90

      - name: Capture visualization package inventory
        if: steps.targets.outputs.visualization == 'true'
        run: |
          mkdir -p build-artifacts/visualization
          docker run --rm \
            --volume "${{ github.workspace }}/build-artifacts/visualization:/out" \
            --entrypoint Rscript \
            omix-r-visualization:ci \
            -e '
              installed <- as.data.frame(installed.packages(lib.loc = .libPaths()))
              write.csv(
                installed[, c("Package", "Version", "Built", "LibPath")],
                "/out/installed-packages.csv",
                row.names = FALSE
              )
              writeLines(capture.output(sessionInfo()), "/out/sessionInfo.txt")
              project <- tempfile("renv-project-")
              dir.create(project)
              renv::snapshot(
                project = project,
                library = .libPaths(),
                lockfile = "/out/renv.lock",
                type = "all",
                # `littler` is supplied by the r-base image and is not restored
                # into the dedicated visualization R library.
                exclude = "littler",
                prompt = FALSE,
                force = TRUE
              )
            '

      - name: Upload visualization package inventory
        if: steps.targets.outputs.visualization == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visualization-package-inventory
          path: build-artifacts/visualization
          if-no-files-found: error
          retention-days: 90

      - name: Capture single-cell package inventory
        if: steps.targets.outputs.singlecell == 'true'
        run: |
          mkdir -p build-artifacts/singlecell
          docker run --rm \
            --volume "${{ github.workspace }}/build-artifacts/singlecell:/out" \
            --entrypoint Rscript \
            omix-r-singlecell:ci \
            -e '
              installed <- as.data.frame(installed.packages(lib.loc = .libPaths()))
              write.csv(
                installed[, c("Package", "Version", "Built", "LibPath")],
                "/out/installed-packages.csv",
                row.names = FALSE
              )
              writeLines(capture.output(sessionInfo()), "/out/sessionInfo.txt")
              project <- tempfile("renv-project-")
              dir.create(project)
              renv::snapshot(
                project = project,
                library = .libPaths(),
                lockfile = "/out/renv.lock",
                type = "all",
                exclude = c("littler", "Omix", "OmixSeurat"),
                prompt = FALSE,
                force = TRUE
              )
            '

      - name: Upload single-cell package inventory
        if: steps.targets.outputs.singlecell == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: singlecell-package-inventory
          path: build-artifacts/singlecell
          if-no-files-found: error
          retention-days: 90

      - name: Capture Seurat conversion package inventory
        if: steps.targets.outputs.conversion == 'true'
        run: |
          mkdir -p build-artifacts/seurat-conversion
          docker run --rm \
            --volume "${{ github.workspace }}/build-artifacts/seurat-conversion:/out" \
            --entrypoint Rscript \
            omix-r-seurat-conversion:ci \
            -e '
              installed <- as.data.frame(installed.packages(lib.loc = .libPaths()))
              write.csv(
                installed[, c("Package", "Version", "Built", "LibPath")],
                "/out/installed-packages.csv",
                row.names = FALSE
              )
              writeLines(capture.output(sessionInfo()), "/out/sessionInfo.txt")
              project <- tempfile("renv-project-")
              dir.create(project)
              renv::snapshot(
                project = project,
                library = .libPaths(),
                lockfile = "/out/renv.lock",
                type = "all",
                exclude = c("littler", "Omix", "OmixSeurat"),
                prompt = FALSE,
                force = TRUE
              )
            '

      - name: Upload Seurat conversion package inventory
        if: steps.targets.outputs.conversion == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seurat-conversion-package-inventory
          path: build-artifacts/seurat-conversion
          if-no-files-found: error
          retention-days: 90

      - name: Capture resolved pathway package inventory
        if: steps.targets.outputs.pathway == 'true'
        run: |
          mkdir -p build-artifacts
          docker run --rm \
            --volume "${{ github.workspace }}/build-artifacts:/out" \
            --entrypoint Rscript \
            omix-r-pathway:ci \
            -e '
              installed <- as.data.frame(installed.packages(lib.loc = .libPaths()))
              write.csv(
                installed[, c("Package", "Version", "Built", "LibPath")],
                "/out/installed-packages.csv",
                row.names = FALSE
              )
              writeLines(capture.output(sessionInfo()), "/out/sessionInfo.txt")
              writeLines(as.character(BiocManager::version()), "/out/bioconductor-version.txt")
              project <- tempfile("renv-project-")
              dir.create(project)
              renv::snapshot(
                project = project,
                library = .libPaths(),
                lockfile = "/out/renv.lock",
                type = "all",
                # These are installed from immutable source artifacts rather
                # than a package repository, so renv cannot record a
                # restorable repository source for them in this ad hoc
                # inventory snapshot.
                exclude = c("l2p", "l2psupp", "OmixPathwayPlots"),
                prompt = FALSE
              )
            '

      - name: Upload pathway package inventory
        if: steps.targets.outputs.pathway == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pathway-package-inventory
          path: build-artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish starter images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          PUBLISH_BASE: ${{ steps.targets.outputs.base }}
          PUBLISH_PATHWAY: ${{ steps.targets.outputs.pathway }}
          PUBLISH_CONVERSION: ${{ steps.targets.outputs.conversion }}
          PUBLISH_SINGLECELL: ${{ steps.targets.outputs.singlecell }}
          PUBLISH_VISUALIZATION: ${{ steps.targets.outputs.visualization }}
          PUBLISH_STATISTICS: ${{ steps.targets.outputs.statistics }}
        run: |
          set -euo pipefail

          base_version="$(tr -d '[:space:]' < starter-environments/r-base/VERSION)"
          pathway_version="$(tr -d '[:space:]' < starter-environments/r-pathway/VERSION)"
          conversion_version="$(tr -d '[:space:]' < starter-environments/r-seurat-conversion/VERSION)"
          singlecell_version="$(tr -d '[:space:]' < starter-environments/r-singlecell/VERSION)"
          visualization_version="$(tr -d '[:space:]' < starter-environments/r-visualization/VERSION)"
          statistics_version="$(tr -d '[:space:]' < starter-environments/r-statistics/VERSION)"

          if [[ "$PUBLISH_BASE" == "true" ]]; then
            docker tag omix-r-base:ci ghcr.io/nidap-community/omix-r-base:${{ github.sha }}
            docker tag omix-r-base:ci ghcr.io/nidap-community/omix-r-base:"$base_version"
            docker push ghcr.io/nidap-community/omix-r-base:${{ github.sha }}
            docker push ghcr.io/nidap-community/omix-r-base:"$base_version"
          fi

          if [[ "$PUBLISH_PATHWAY" == "true" ]]; then
            docker tag omix-r-pathway:ci ghcr.io/nidap-community/omix-r-pathway:${{ github.sha }}
            docker tag omix-r-pathway:ci ghcr.io/nidap-community/omix-r-pathway:"$pathway_version"
            docker push ghcr.io/nidap-community/omix-r-pathway:${{ github.sha }}
            docker push ghcr.io/nidap-community/omix-r-pathway:"$pathway_version"
          fi

          if [[ "$PUBLISH_CONVERSION" == "true" ]]; then
            if [[ "$conversion_version" == *-v0 ]]; then
              echo "r-seurat-conversion is still a bootstrap definition; Linux CI must validate its committed lockfile and supported object-conversion tests before publishing." >&2
              exit 1
            fi
            docker tag omix-r-seurat-conversion:ci ghcr.io/nidap-community/omix-r-seurat-conversion:${{ github.sha }}
            docker tag omix-r-seurat-conversion:ci ghcr.io/nidap-community/omix-r-seurat-conversion:"$conversion_version"
            docker push ghcr.io/nidap-community/omix-r-seurat-conversion:${{ github.sha }}
            docker push ghcr.io/nidap-community/omix-r-seurat-conversion:"$conversion_version"
          fi

          if [[ "$PUBLISH_SINGLECELL" == "true" ]]; then
            if [[ "$singlecell_version" == *-v0 ]]; then
              echo "r-singlecell is still a bootstrap definition; commit its CI-captured renv.lock, replace the bootstrap installer, and change VERSION to v1 or later before publishing." >&2
              exit 1
            fi
            docker tag omix-r-singlecell:ci ghcr.io/nidap-community/omix-r-singlecell:${{ github.sha }}
            docker tag omix-r-singlecell:ci ghcr.io/nidap-community/omix-r-singlecell:"$singlecell_version"
            docker push ghcr.io/nidap-community/omix-r-singlecell:${{ github.sha }}
            docker push ghcr.io/nidap-community/omix-r-singlecell:"$singlecell_version"
          fi

          if [[ "$PUBLISH_VISUALIZATION" == "true" ]]; then
            if [[ "$visualization_version" == *-v0 ]]; then
              echo "r-visualization is still a bootstrap definition; commit its CI-captured renv.lock and change VERSION to v1 or later before publishing." >&2
              exit 1
            fi
            docker tag omix-r-visualization:ci ghcr.io/nidap-community/omix-r-visualization:${{ github.sha }}
            docker tag omix-r-visualization:ci ghcr.io/nidap-community/omix-r-visualization:"$visualization_version"
            docker push ghcr.io/nidap-community/omix-r-visualization:${{ github.sha }}
            docker push ghcr.io/nidap-community/omix-r-visualization:"$visualization_version"
          fi

          if [[ "$PUBLISH_STATISTICS" == "true" ]]; then
            if [[ "$statistics_version" == *-v0 ]]; then
              echo "r-statistics is still a bootstrap definition; commit its CI-captured renv.lock and change VERSION to v1 or later before publishing." >&2
              exit 1
            fi
            docker tag omix-r-statistics:ci ghcr.io/nidap-community/omix-r-statistics:${{ github.sha }}
            docker tag omix-r-statistics:ci ghcr.io/nidap-community/omix-r-statistics:"$statistics_version"
            docker push ghcr.io/nidap-community/omix-r-statistics:${{ github.sha }}
            docker push ghcr.io/nidap-community/omix-r-statistics:"$statistics_version"
          fi

      - name: Record published image digests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          PUBLISH_BASE: ${{ steps.targets.outputs.base }}
          PUBLISH_PATHWAY: ${{ steps.targets.outputs.pathway }}
          PUBLISH_CONVERSION: ${{ steps.targets.outputs.conversion }}
          PUBLISH_SINGLECELL: ${{ steps.targets.outputs.singlecell }}
          PUBLISH_VISUALIZATION: ${{ steps.targets.outputs.visualization }}
          PUBLISH_STATISTICS: ${{ steps.targets.outputs.statistics }}
        run: |
          set -euo pipefail

          base_version="$(tr -d '[:space:]' < starter-environments/r-base/VERSION)"
          pathway_version="$(tr -d '[:space:]' < starter-environments/r-pathway/VERSION)"
          conversion_version="$(tr -d '[:space:]' < starter-environments/r-seurat-conversion/VERSION)"
          singlecell_version="$(tr -d '[:space:]' < starter-environments/r-singlecell/VERSION)"
          visualization_version="$(tr -d '[:space:]' < starter-environments/r-visualization/VERSION)"
          statistics_version="$(tr -d '[:space:]' < starter-environments/r-statistics/VERSION)"
          {
            echo '## Published OMIX starter environments'
            echo
            if [[ "$PUBLISH_BASE" == "true" ]]; then
              base_ref="ghcr.io/nidap-community/omix-r-base:$base_version"
              base_digest="$(docker buildx imagetools inspect "$base_ref" --format '{{.Manifest.Digest}}')"
              echo "- \`$base_ref@$base_digest\`"
            fi
            if [[ "$PUBLISH_PATHWAY" == "true" ]]; then
              pathway_ref="ghcr.io/nidap-community/omix-r-pathway:$pathway_version"
              pathway_digest="$(docker buildx imagetools inspect "$pathway_ref" --format '{{.Manifest.Digest}}')"
              echo "- \`$pathway_ref@$pathway_digest\`"
            fi
            if [[ "$PUBLISH_CONVERSION" == "true" ]]; then
              conversion_ref="ghcr.io/nidap-community/omix-r-seurat-conversion:$conversion_version"
              conversion_digest="$(docker buildx imagetools inspect "$conversion_ref" --format '{{.Manifest.Digest}}')"
              echo "- \`$conversion_ref@$conversion_digest\`"
            fi
            if [[ "$PUBLISH_SINGLECELL" == "true" ]]; then
              singlecell_ref="ghcr.io/nidap-community/omix-r-singlecell:$singlecell_version"
              singlecell_digest="$(docker buildx imagetools inspect "$singlecell_ref" --format '{{.Manifest.Digest}}')"
              echo "- \`$singlecell_ref@$singlecell_digest\`"
            fi
            if [[ "$PUBLISH_VISUALIZATION" == "true" ]]; then
              visualization_ref="ghcr.io/nidap-community/omix-r-visualization:$visualization_version"
              visualization_digest="$(docker buildx imagetools inspect "$visualization_ref" --format '{{.Manifest.Digest}}')"
              echo "- \`$visualization_ref@$visualization_digest\`"
            fi
            if [[ "$PUBLISH_STATISTICS" == "true" ]]; then
              statistics_ref="ghcr.io/nidap-community/omix-r-statistics:$statistics_version"
              statistics_digest="$(docker buildx imagetools inspect "$statistics_ref" --format '{{.Manifest.Digest}}')"
              echo "- \`$statistics_ref@$statistics_digest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  adopt-existing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.adopt_existing }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag existing starter images without rebuilding
        run: |
          source_tag="${{ inputs.existing_source_tag }}"
          base_version="$(tr -d '[:space:]' < starter-environments/r-base/VERSION)"
          pathway_version="$(tr -d '[:space:]' < starter-environments/r-pathway/VERSION)"
          visualization_version="$(tr -d '[:space:]' < starter-environments/r-visualization/VERSION)"
          statistics_version="$(tr -d '[:space:]' < starter-environments/r-statistics/VERSION)"
          base_source="ghcr.io/nidap-community/omix-r-base:$source_tag"
          pathway_source="ghcr.io/nidap-community/omix-r-pathway:$source_tag"
          statistics_source="ghcr.io/nidap-community/omix-r-statistics:$source_tag"
          base_target="ghcr.io/nidap-community/omix-r-base:$base_version"
          pathway_target="ghcr.io/nidap-community/omix-r-pathway:$pathway_version"
          statistics_target="ghcr.io/nidap-community/omix-r-statistics:$statistics_version"

          docker buildx imagetools inspect "$base_source"
          docker buildx imagetools inspect "$pathway_source"
          docker buildx imagetools create --prefer-index=false --tag "$base_target" "$base_source"
          docker buildx imagetools create --prefer-index=false --tag "$pathway_target" "$pathway_source"
          if [[ "$visualization_version" == *-v0 ]]; then
            echo "r-visualization is still a bootstrap definition; skipping manifest adoption until VERSION is v1 or later."
          else
            visualization_source="ghcr.io/nidap-community/omix-r-visualization:$source_tag"
            visualization_target="ghcr.io/nidap-community/omix-r-visualization:$visualization_version"
            docker buildx imagetools inspect "$visualization_source"
            docker buildx imagetools create --prefer-index=false --tag "$visualization_target" "$visualization_source"
          fi
          if docker buildx imagetools inspect "$statistics_source"; then
            docker buildx imagetools create --prefer-index=false --tag "$statistics_target" "$statistics_source"
          else
            echo "No existing r-statistics image at $statistics_source; skipping adoption."
          fi

      - name: Record adopted image digests
        run: |
          base_version="$(tr -d '[:space:]' < starter-environments/r-base/VERSION)"
          pathway_version="$(tr -d '[:space:]' < starter-environments/r-pathway/VERSION)"
          visualization_version="$(tr -d '[:space:]' < starter-environments/r-visualization/VERSION)"
          statistics_version="$(tr -d '[:space:]' < starter-environments/r-statistics/VERSION)"
          base_ref="ghcr.io/nidap-community/omix-r-base:$base_version"
          pathway_ref="ghcr.io/nidap-community/omix-r-pathway:$pathway_version"
          statistics_ref="ghcr.io/nidap-community/omix-r-statistics:$statistics_version"
          base_digest="$(docker buildx imagetools inspect "$base_ref" --format '{{.Manifest.Digest}}')"
          pathway_digest="$(docker buildx imagetools inspect "$pathway_ref" --format '{{.Manifest.Digest}}')"
          {
            echo '## Adopted existing OMIX starter environments'
            echo
            echo "- \`$base_ref@$base_digest\`"
            echo "- \`$pathway_ref@$pathway_digest\`"
            if [[ "$visualization_version" != *-v0 ]]; then
              visualization_ref="ghcr.io/nidap-community/omix-r-visualization:$visualization_version"
              visualization_digest="$(docker buildx imagetools inspect "$visualization_ref" --format '{{.Manifest.Digest}}')"
              echo "- \`$visualization_ref@$visualization_digest\`"
            fi
            if statistics_digest="$(docker buildx imagetools inspect "$statistics_ref" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              echo "- \`$statistics_ref@$statistics_digest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
