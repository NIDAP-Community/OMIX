interface_version: 1
entrypoint: scripts/run_gsea_filters.R
control_classifications:
  public: Standard user-facing control that deployment adapters should expose.
  advanced: Supported user-facing control that deployment adapters should expose in an advanced section.
  internal: Portable CLI plumbing that deployment adapters manage rather than expose.
inputs:
  input:
    required: true
    type: path
    classification: public
    formats: [csv, tsv, txt, rds]
    description: GSEA result table containing contrasts, pathway annotations, p-values, enrichment scores, and pathway membership columns.
parameters:
  output_dir:
    type: path
    default: results
    classification: internal
    description: Portable result directory. Deployment adapters provide their platform-managed output location.
  p_value_filter:
    type: string
    default: adjusted p-value
    classification: public
    allowed: [adjusted p-value, raw p-value]
  p_value_threshold:
    type: number
    default: 0.05
    classification: public
    minimum: 0
    maximum: 1
  enrichment_score_filter:
    type: string
    default: NES (Normalized Enrichment Score)
    classification: public
    allowed: [NES (Normalized Enrichment Score), ES (Enrichment Score)]
  enrichment_score_threshold:
    type: number
    default: 0
    classification: public
    minimum: 0
    description: Minimum absolute enrichment score; its sign is controlled separately.
  enrichment_score_sign:
    type: string
    default: +/-
    classification: public
    allowed: [+/-, +, -]
  size_filter:
    type: string
    default: Pathway size
    classification: advanced
    allowed: [Pathway size, Leading Edge (LE) size]
  size_cutoff:
    type: integer
    default: 0
    classification: advanced
    minimum: 0
  top_rank_filter:
    type: string
    default: all
    classification: public
    description: Use `all` or a positive numeric rank applied within each contrast and collection.
  collections_to_include:
    type: string
    default: null
    classification: advanced
    delimiter: ","
    description: Optional comma-separated collection names.
  pathways_to_include:
    type: string
    default: null
    classification: advanced
    delimiter: ","
    description: Optional comma-separated pathway names.
  gene_filter_universe:
    type: string
    default: Leading Edge (LE)
    classification: advanced
    allowed: [Leading Edge (LE), Pathway]
  genes_to_include:
    type: string
    default: null
    classification: advanced
    delimiter: ","
    description: Optional comma-separated gene symbols.
  contrast_filter:
    type: string
    default: none
    classification: public
    allowed: [none, keep, remove]
  contrasts:
    type: string
    default: null
    classification: public
    delimiter: ","
    description: Optional comma-separated contrast names used with keep or remove mode.
outputs:
  filtered_gsea_results:
    path: filtered_gsea_results.csv
    format: csv
  filtered_gsea_results_rds:
    path: filtered_gsea_results.rds
    format: rds
