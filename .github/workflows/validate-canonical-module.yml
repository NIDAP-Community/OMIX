name: Validate canonical module

on:
  pull_request:
    paths:
      - modules/**
      - scripts/canonical_module_validation.py
      - templates/canonical-module-validation/**
      - tests/test_canonical_module_validation.py
      - .github/workflows/validate-canonical-module.yml
  workflow_dispatch:
    inputs:
      module:
        description: Canonical module to validate, or all for every opted-in module
        required: true
        default: all
        type: string

permissions:
  contents: read
  packages: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: modules
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODULE: ${{ inputs.module }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            matrix="$(python3 scripts/canonical_module_validation.py discover --module "$REQUESTED_MODULE")"
          else
            matrix="$(python3 scripts/canonical_module_validation.py discover --base "$PULL_REQUEST_BASE_SHA" --head "$PULL_REQUEST_HEAD_SHA")"
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build validation plan
        id: plan
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/validation-artifacts/$MODULE"
          mkdir -p "$artifact_dir"
          python3 scripts/canonical_module_validation.py plan \
            --module "$MODULE" \
            --output "$artifact_dir/validation-plan.json"
          python3 scripts/canonical_module_validation.py write-runner \
            --plan "$artifact_dir/validation-plan.json" \
            --output "$artifact_dir/run-validation.sh"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "image=$(python3 scripts/canonical_module_validation.py plan --module "$MODULE" --image-only)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable runtime
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
        run: docker pull "$IMAGE"
      - name: Run direct tests and fixture in the immutable runtime
        env:
          ARTIFACT_DIR: ${{ steps.plan.outputs.artifact_dir }}
          IMAGE: ${{ steps.plan.outputs.image }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$ARTIFACT_DIR:/artifacts" \
            --workdir /workspace \
            "$IMAGE" \
            bash /artifacts/run-validation.sh
      - name: Record validation artifact checksums
        env:
          ARTIFACT_DIR: ${{ steps.plan.outputs.artifact_dir }}
        run: |
          python3 scripts/canonical_module_validation.py report \
            --plan "$ARTIFACT_DIR/validation-plan.json" \
            --artifact-directory "$ARTIFACT_DIR"
          cat "$ARTIFACT_DIR/validation-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-module-validation-${{ matrix.module }}
          path: ${{ steps.plan.outputs.artifact_dir }}
          if-no-files-found: error
