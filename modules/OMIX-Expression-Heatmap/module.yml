name: omix-expression-heatmap
display_name: OMIX Expression Heatmap
version: 0.4.0
interface_version: 1
module_type: visualization
status: development
owner: OMIX Team
description: Render annotated ComplexHeatmap expression heatmaps from normalized continuous feature-by-sample matrices.
