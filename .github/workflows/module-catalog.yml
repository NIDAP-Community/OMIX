name: Validate canonical module catalog

on:
  pull_request:
    paths:
      - README.md
      - modules/*/module.yml
      - docs/module-lifecycle.md
      - tests/test_module_catalog.py
      - .github/workflows/module-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compare README catalog with canonical module metadata
        run: python3 tests/test_module_catalog.py
