interface_version: 1
entrypoint: scripts/run_l2p_single.R
control_classifications:
  public: Standard user-facing control that deployment adapters should expose.
  advanced: Supported user-facing control that deployment adapters should expose in an advanced section.
  internal: Portable CLI plumbing that deployment adapters manage rather than expose.
inputs:
  deg_table:
    required: true
    type: path
    classification: public
    formats: [csv, tsv, txt, rds]
    description: Differential-expression table containing one comparison or a wide table with comparison-prefixed columns.
  custom_pathways:
    required: false
    type: path
    default: null
    classification: advanced
    formats: [csv, tsv, txt, rds]
    description: Optional custom pathway database. Delimited tables must contain pathway-name and gene-symbol columns; RDS may contain a compatible table or L2P pathway list.
parameters:
  comparison:
    required: false
    type: string
    default: null
    classification: public
    mutually_exclusive_with: comparisons
    description: One comparison identifier used to infer matching DEG columns when explicit columns are not supplied. Supply this or `comparisons`, not both. When both controls are blank, the module proceeds only if exactly one complete comparison prefix can be detected using the configured suffixes, which default to `_pval` and `_FC`, or `_tstat` in rank mode.
  comparisons:
    required: false
    type: string
    default: null
    classification: public
    delimiter: ","
    preserves_order: true
    mutually_exclusive_with: comparison
    description: Comma-separated comparison identifiers for independent batched runs in the requested order. Batched runs require comparison-prefixed DEG columns and do not accept explicit t-statistic, significance, or fold-change column overrides. When both comparison controls are blank, the module proceeds only if exactly one complete comparison prefix can be detected using the configured suffixes, which default to `_pval` and `_FC`, or `_tstat` in rank mode.
  output_dir:
    type: path
    default: results
    classification: internal
    description: Portable result directory. Deployment adapters provide their platform-managed output location.
  species:
    type: string
    default: Human
    classification: public
    allowed: [Human, Mouse, Macaque, Rat, Zebrafish, Rabbit, Drosophila]
  collections_to_include:
    type: string
    default: GO,REACTOME,KEGG
    classification: public
    delimiter: ","
    item_allowed: [GO, REACTOME, KEGG, PANTH, PID, BIOCYC, WikiPathways, H, C1, C2, C3, C4, C6, C7, C8]
    description: Comma-separated built-in pathway collection codes. Custom pathways may be supplied independently.
  gene_names_column:
    type: string
    default: null
    classification: advanced
    description: Optional exact gene-symbol column; common gene column names are inferred when omitted.
  t_statistic_column:
    type: string
    default: null
    classification: advanced
    description: Optional signed rank column. Required for rank selection unless it can be inferred from `comparison`; not accepted as a fixed override for a batched run.
  significance_column:
    type: string
    default: null
    classification: advanced
    description: Optional p-value or adjusted-p-value column. Required for threshold selection unless it can be inferred from `comparison`; not accepted as a fixed override for a batched run.
  fold_change_column:
    type: string
    default: null
    classification: advanced
    description: Optional linear- or log-fold-change column. Required for threshold selection unless it can be inferred from `comparison`; not accepted as a fixed override for a batched run.
  t_statistic_suffix:
    type: string
    default: _tstat
    classification: advanced
    description: Suffix appended to each comparison identifier to resolve its ranking column. Applies to automatic detection and batched runs; an exact single-comparison column override takes precedence.
  significance_suffix:
    type: string
    default: _pval
    classification: advanced
    description: Suffix appended to each comparison identifier to resolve its significance column. Applies to automatic detection and batched runs; an exact single-comparison column override takes precedence.
  fold_change_suffix:
    type: string
    default: _FC
    classification: advanced
    description: Suffix appended to each comparison identifier to resolve its fold-change column. Applies to automatic detection and batched runs; an exact single-comparison column override takes precedence.
  select_by_rank:
    type: boolean
    default: false
    classification: public
    description: Select DEG lists using the significance and fold-change thresholds. Set true to use the legacy t-statistic rank method.
  select_top_percentage_of_genes:
    type: boolean
    default: true
    classification: advanced
    description: With rank selection, use the top and bottom 10 percent rather than a fixed gene count.
  select_top_genes:
    type: integer
    default: 500
    classification: advanced
    minimum: 1
    description: With rank selection and percentage selection disabled, number of genes selected from each end of the ranking.
  significance_threshold:
    type: number
    default: 0.05
    classification: public
    minimum: 0
    maximum: 1
    description: Maximum nominal p-value, or the threshold applied to an explicitly selected adjusted-p-value column, for DEG-list selection.
  fold_change_threshold:
    type: number
    default: 1.2
    classification: public
    minimum_exclusive: 0
    description: Minimum absolute linear fold change for DEG-list selection. For a log-fold-change column, the corresponding log2 threshold is used.
  minimum_number_of_deg_genes:
    type: integer
    default: 50
    classification: advanced
    minimum: 0
    description: Desired minimum selected-gene count per direction before the module reports a warning.
  minimum_pathway_hit_count:
    type: integer
    default: 5
    classification: advanced
    minimum: 0
    description: Minimum number of selected genes in a pathway retained in the output.
  p_value_threshold_for_output:
    type: number
    default: 0.05
    classification: advanced
    minimum: 0
    maximum: 1
    description: Maximum nominal Fisher exact p-value retained in the pathway output.
  use_built_in_gene_universe:
    type: boolean
    default: false
    classification: advanced
    description: Use the L2P built-in universe instead of all genes in the DEG table.
  use_fdr_p_values:
    type: boolean
    default: false
    classification: advanced
    description: Use FDR rather than nominal p-values in the legacy summary bar plot.
  custom_pathway_name_column:
    type: string
    default: gene_set_name
    classification: advanced
    description: Pathway-name column in a tabular custom pathway database.
  custom_pathway_gene_column:
    type: string
    default: gene_symbol
    classification: advanced
    description: Gene-symbol column in a tabular custom pathway database.
  number_of_pathways_to_plot:
    type: integer
    default: 20
    classification: public
    minimum: 1
    description: Number of top pathways displayed per upregulated or downregulated direction in the summary plot.
  pathway_axis_label_max_length:
    type: integer
    default: 50
    classification: advanced
    minimum: 1
    description: Maximum pathway-label wrap width before font-size adjustment.
  pathway_axis_label_font_size:
    type: integer
    default: 15
    classification: advanced
    minimum_exclusive: 0
  x_axis_title_font_size:
    type: integer
    default: 20
    classification: advanced
    minimum_exclusive: 0
  y_axis_title_font_size:
    type: integer
    default: 20
    classification: advanced
    minimum_exclusive: 0
  x_axis_tick_font_size:
    type: integer
    default: 15
    classification: advanced
    minimum_exclusive: 0
  plot_top_pathways_up:
    type: boolean
    default: true
    classification: advanced
    description: Automatically select the most significant upregulated pathways for plotting.
  pathways_to_use_up:
    type: string
    default: null
    classification: advanced
    delimiter: ","
    preserves_order: true
    description: Comma-separated upregulated pathway names used when `plot_top_pathways_up` is false.
  plot_top_pathways_down:
    type: boolean
    default: true
    classification: advanced
    description: Automatically select the most significant downregulated pathways for plotting.
  pathways_to_use_down:
    type: string
    default: null
    classification: advanced
    delimiter: ","
    preserves_order: true
    description: Comma-separated downregulated pathway names used when `plot_top_pathways_down` is false.
  sort_bubble_plot_by:
    type: string
    default: percent gene hits per pathway
    classification: advanced
    allowed: [percent gene hits per pathway, "Fisher's Exact pval", fdr corrected pval, enrichment score, number of hits]
  plot_bubble_size:
    type: string
    default: number of hits
    classification: advanced
    allowed: [number of hits, percent gene hits per pathway, enrichment score, "Fisher's Exact pval", fdr corrected pval]
  plot_bubble_color:
    type: string
    default: "Fisher's Exact pval"
    classification: advanced
    allowed: ["Fisher's Exact pval", fdr corrected pval, percent gene hits per pathway, number of hits, enrichment score]
  bubble_colors:
    type: string
    default: blues
    classification: advanced
    allowed: [blues, reds, blue to red]
  color_for_bar:
    type: string
    default: GreentoBlue
    classification: advanced
    allowed: [Blue, Green, Orange, Grey, Red, Purple, GreentoBlue, OrangetoRed, YellowOrangeRed]
  export_plot_width:
    type: number
    default: 12
    classification: advanced
    minimum_exclusive: 0
    description: Width in inches for each exported summary plot.
  export_plot_height:
    type: number
    default: 12
    classification: advanced
    minimum_exclusive: 0
    description: Height in inches for each exported summary plot.
outputs:
  l2p_results:
    path: l2p_results.csv
    format: csv
  l2p_provenance:
    path: l2p_results_provenance.csv
    format: csv
  l2p_plots:
    path: l2p_plots_*.png
    format: png
  l2p_run_manifest:
    path: l2p_single_run_manifest.csv
    format: csv
    description: One row per requested comparison, recording its output directory, files, status, and result-row count. Batched runs create one subdirectory per comparison.
