name: Starter Environments

on:
  pull_request:
    paths:
      - starter-environments/**
      - .github/workflows/starter-environments.yml
  push:
    branches:
      - main
    paths:
      - starter-environments/**
      - .github/workflows/starter-environments.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated images to GHCR
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build r-base
        uses: docker/build-push-action@v6
        with:
          context: starter-environments/r-base
          load: true
          tags: omix-r-base:ci

      - name: Build r-pathway
        uses: docker/build-push-action@v6
        with:
          context: starter-environments/r-pathway
          build-args: BASE_IMAGE=omix-r-base:ci
          load: true
          tags: omix-r-pathway:ci

      - name: Log in to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish starter images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          docker tag omix-r-base:ci ghcr.io/nidap-community/omix-r-base:${{ github.sha }}
          docker tag omix-r-base:ci ghcr.io/nidap-community/omix-r-base:latest
          docker tag omix-r-pathway:ci ghcr.io/nidap-community/omix-r-pathway:${{ github.sha }}
          docker tag omix-r-pathway:ci ghcr.io/nidap-community/omix-r-pathway:latest
          docker push ghcr.io/nidap-community/omix-r-base:${{ github.sha }}
          docker push ghcr.io/nidap-community/omix-r-base:latest
          docker push ghcr.io/nidap-community/omix-r-pathway:${{ github.sha }}
          docker push ghcr.io/nidap-community/omix-r-pathway:latest
