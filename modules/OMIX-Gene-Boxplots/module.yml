name: omix-gene-boxplots
display_name: OMIX Gene Boxplots
version: 0.1.1
module_type: visualization
status: review
owner: OMIX Team
description: Platform-neutral gene-expression boxplots that either annotate precomputed DEG statistics or calculate independent within-plot tests.
data_policy: No data are committed. Callers supply explicit expression and metadata table paths through the CLI or a platform adapter.
runtime_profile: r-visualization
entrypoint: scripts/run_gene_boxplots.R
deployment_adapters:
  - platform: code-ocean
    repository: https://github.com/NIDAP-Community/OMIX-Gene-Boxplots
