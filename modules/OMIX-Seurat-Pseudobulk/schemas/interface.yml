interface_version: 2
entrypoint: scripts/run_seurat_pseudobulk.R
inputs:
  seurat_rds:
    required: true
    formats: [rds]
    description: Serialized Seurat object read through the r-seurat-conversion compatibility runtime. The declared assay/layer must match the selected aggregation_method; specialized legacy SCTAssay objects require full Seurat in that runtime.
parameters:
  donor_column:
    type: string
    required: true
    description: Cell-metadata column identifying biological donors or other independent biological replicates.
  group_column:
    type: string
    required: true
    description: Cell-metadata column identifying the experimental condition written as Group for DEG analysis.
  cell_category_column:
    type: string
    required: true
    description: Cell-metadata column defining the pseudobulk category. It can contain cell types, clusters, subclusters, tissue or spatial regions, or cell-state labels; every retained category must remain represented in at least two experimental groups after filtering.
  cell_category:
    type: string
    default: ""
    required_when: cell_category_mode=one
    description: One exact category label to retain before aggregation in one mode. Existing one-mode calls retain the established root-level bundle layout.
  cell_category_mode:
    type: string
    default: one
    allowed: [one, selected, all]
    description: one writes the established single bundle; selected reads an ordered exact-category selection table; all enumerates every non-missing category remaining after the explicit cell filter and writes a deterministic nested collection.
  cell_category_selection:
    type: path
    default: ""
    required_when: cell_category_mode=selected
    formats: [csv, tsv, txt]
    description: Ordered one-column table named CellCategory containing exact category labels for selected mode. Duplicate, empty, and unknown labels are rejected.
  metadata_columns:
    type: string
    default: ""
    description: Optional comma-separated sample-level columns, such as Batch or Sex. Every value must be invariant and non-missing within each donor-by-group profile.
  cell_filter_column:
    type: string
    default: ""
    description: Optional cell-level pre-aggregation inclusion filter. Use it with cell_filter_values to restrict cells before category discovery and aggregation; it does not create separate category-specific outputs.
  cell_filter_values:
    type: string
    default: ""
    description: Optional comma-separated exact values retained from cell_filter_column. The same filter applies to every category.
  aggregation_method:
    type: string
    default: sum_counts
    allowed: [sum_counts, mean_harmony_corrected_expression, mean_sctransform_expression]
    description: sum_counts creates raw pseudobulk for edgeR/voom. mean_harmony_corrected_expression averages a declared Harmony-corrected gene-expression layer for direct limma. mean_sctransform_expression averages Seurat SCT/data, then converts the donor means from log1p to log2 scale for direct limma.
  assay:
    type: string
    default: auto
    description: auto resolves to RNA for sum_counts, Harmony for mean_harmony_corrected_expression, and SCT for mean_sctransform_expression.
  layer:
    type: string
    default: auto
    description: auto resolves to counts for sum_counts and data for continuous-expression modes. mean_sctransform_expression requires data; explicitly name the validated Harmony-corrected expression layer when it is not data.
  feature_id_column:
    type: string
    default: GeneName
    allowed: [GeneName]
    description: Fixed feature identifier required by the downstream DEG and Limma handoff contracts.
  min_cells:
    type: integer
    default: 20
  on_insufficient_cells:
    type: string
    default: error
    allowed: [error, drop]
    description: error stops when any donor-by-group profile is below min_cells. In selected/all collection mode, drop excludes those profiles and omits a cell category that then has fewer than two eligible groups; the catalog and run summary record the omission.
  output_dir:
    type: path
    default: results
outputs:
  donor_level_matrix:
    path: Pseudobulk_Counts.csv, Harmony_Mean_Expression.csv, or SCT_Mean_Log2_Expression.csv
    format: csv
    description: GeneName-by-profile raw integer counts for sum_counts, donor-level Harmony-corrected mean expression for mean_harmony_corrected_expression, or donor-level log2 SCTransform corrected expression for mean_sctransform_expression.
  sample_metadata:
    path: Pseudobulk_Sample_Metadata.csv
    format: csv
    description: Aligned Sample, Donor, Group, CellCategory, Cells, and requested invariant covariates.
  manifest:
    path: Pseudobulk_Manifest.dcf
    format: dcf
    description: Declares matrix semantics, source layer, expected downstream module and mode, input kind, and recommended variance model.
  run_summary:
    path: Pseudobulk_Run_Summary.txt
    format: text
    description: Aggregation parameters, profile counts, correction provenance, and bridge provenance.
  collection_profile_catalog:
    path: Cell_Category_Profile_Catalog.csv
    format: csv
    required_when: cell_category_mode=selected or cell_category_mode=all
    description: One row per requested cell category, donor, and group profile before output filtering, including cell counts, profile and category eligibility or exclusion, nested bundle paths for written categories, aggregation settings, and source provenance.
  collection_manifest:
    path: Pseudobulk_Collection_Manifest.dcf
    format: dcf
    required_when: cell_category_mode=selected or cell_category_mode=all
    description: Collection routing and provenance record, including requested, written, and omitted cell-category counts. Each nested cell_categories/<stable-id> directory for a written cell category retains the ordinary Pseudobulk_Manifest.dcf consumed by downstream analysis.
  collection_run_summary:
    path: Pseudobulk_Collection_Run_Summary.txt
    format: text
    required_when: cell_category_mode=selected or cell_category_mode=all
    description: Requested, written, and omitted labels, mode, aggregation settings, and collection artifact names.
